# CI for the standalone API Gateway (docs/microservices-migration).
# Scoped to gateway/** so it doesn't run on unrelated monolith changes and
# doesn't participate in the Gradle multi-project build.

name: API Gateway CI

on:
  push:
    branches: [trunk]
    paths: ['gateway/**']
  pull_request:
    branches: [trunk]
    paths: ['gateway/**']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage
