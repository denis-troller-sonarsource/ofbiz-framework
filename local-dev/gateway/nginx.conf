events {}
http {
  upstream legacy { server legacy-ofbiz-app:8443; }
  upstream invoices { server modern-accounting-invoice-service:8080; }
  upstream notifications { server modern-notification-service:8080; }

  server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/local.crt;
    ssl_certificate_key /etc/nginx/tls/local.key;

    location = /accounting/control/findInvoices { proxy_pass http://invoices; }
    location ^~ /modern/accounting/invoices { proxy_pass http://invoices; }
    location ^~ /api/accounting/invoices { proxy_pass http://invoices; }
    location ^~ /api/notifications/ { proxy_pass http://notifications; }

    # Everything not explicitly strangled remains in OFBiz.
    location / {
      proxy_pass https://legacy;
      proxy_ssl_verify off;
      proxy_set_header Host localhost:18443;
      proxy_set_header X-Forwarded-Host localhost:18080;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter 'https://localhost:18443' 'https://localhost:18080';
    }
  }
}
